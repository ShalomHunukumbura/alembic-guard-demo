[project]
name = "alembic-guard-demo"
version = "0.1.0"
description = "A small FastAPI + Alembic app showing alembic-guard catching a dangerous migration in a PR."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = ["alembic-guard>=0.1.0"]

[tool.uv]
package = false
